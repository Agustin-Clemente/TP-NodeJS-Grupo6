            <div class="col-8 col-md-6 col-lg-4 tabla">
                <h1 class="text-center">Editar </h1>

                <div class="my-4 text-center">

                    <label for="id">ID</label>

                <form id="formulario">

                   <!--  <div class="mb-3 text-center">

                    <div class="form-group text-center">
                        <label for="id_destino">Destino</label>
                        <select class="form-control" id="id_destino" name="id_destino" onblur="habilitar()" required>
                            <option value="1">Catamarca</option>
                            <option value="2">San Juan</option>
                            <option value="3">Tucumán</option>
                        </select>
                    </div>

                    <div class="mb-3 text-center my-5">
                        <label for="paquete.duracion" class="form-label">Duración</label>
                        <input type="number" class="form-control" id="paquete.duracion" name="paquete.duracion" onblur="habilitar()"
                            required>
                    </div>
                  
                    <fieldset class="mb-3 text-center my-5">
                    <legend>Disponible</legend>
                    <label for="paquete.disponible"> 
                        <input type="radio" name="paquete.disponible" id="paquete.disponible" value="1" onblur="habilitar()"> Sí
                    </label>
                    <label>
                        <input type="radio" name="paquete.disponible" id="paquete.disponible" value="2" onblur="habilitar()"> No
                    </label>
                </fieldset>
                    <div class="mb-3 text-center my-5">
                        <label for="paquete.precio" class="form-label">Precio</label>
                        <input type="number" class="form-control" id="paquete.precio" name="paquete.precio" onblur="habilitar()" required>
                    </div>
                   
                    <div class="form-group text-center">
                        <label for="paquete.descuento">Descuento</label>
                        <select class="form-control" id="paquete.descuento" name="paquete.descuento" onblur="habilitar()" required>
                            <option value="1">10</option>
                            <option value="2">15</option>
                            <option value="3">20</option>
                            <option value="4">50</option>
                        </select>
                    </div>

        


                    <div class="d-grid gap-2 mx-auto text-center my-5">
                        <button type="submit" class="btn btn-outline-danger" id="confirmar">Confirmar</button>
                    </div>

                    <div class="d-grid gap-2 mx-auto text-center my-5">
                        <button type="button" class="btn btn-danger" id="eliminar">Eliminar</button>
                    </div>




                </form>
