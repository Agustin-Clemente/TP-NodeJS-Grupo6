                <div class="form-group text-center">
                    <label for="id_destino">Destino</label>
                    <select class="form-control" id="id_destino" name="id_destino" required>
                        <option value="1">Catamarca</option>
                        <option value="2">San Juan</option>
                        <option value="3">Tucumán</option>
                    </select>
                </div>
                <div class="mb-3 text-center my-3">
                    <label for="precio" class="form-label">Precio</label>
                    <input type="number" class="form-control" id="precio" name="precio"
                        required>
                </div>

                <div class="mb-3 text-center my-3">
                    <label for="duracion" class="form-label">Duración</label>
                    <input type="number" class="form-control" id="duracion" name="duracion"
                        required>
                </div>

                <!-- <div class="mb-3 text-center my-3">
                    <label for="disponible" class="form-label">Disponible</label>
                    <input type="number" class="form-control" id="disponible" name="disponible"
                        required>
                </div> -->

                <fieldset class="mb-3 text-center my-5">
                    <legend>Disponible</legend>
                    <label for="paquete.disponible"> 
                        <input type="radio" name="paquete.disponible" id="paquete.disponible" value="1"> Sí
                    </label>
                    <label>
                        <input type="radio" name="paquete.disponible" id="paquete.disponible" value="2"> No

                </fieldset>

               <!--  <div class="mb-3 text-center my-3">

                <div class="form-group text-center">
                    <label for="paquete.descuento">Descuento</label>
                    <select class="form-control" id="paquete.descuento" name="paquete.descuento" required>
                        <option value="1">10</option>
                        <option value="2">15</option>
                        <option value="3">20</option>
                        <option value="4">50</option>
                    </select>
                </div>



                <div class="d-grid gap-2 mx-auto text-center my-5">

                </div>

                <div class="d-grid gap-2 mx-auto text-center my-5">
